name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# Moindre privilège : la CI ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  build:
    name: Tests, APK et contrôles de sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions épinglées par empreinte de commit (un tag peut être déplacé).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Vérifier l'intégrité du wrapper Gradle
        uses: gradle/actions/wrapper-validation@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Tests du cœur (crypto, coffre, sauvegarde)
        run: ./gradlew -p core test --console=plain

      - name: Construire l'APK
        run: ./gradlew -p android :app:assembleRelease --console=plain

      - name: Garantie n° 1 — aucune permission réseau dans l'APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -E "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE)" permissions.txt; then
            echo "::error::Une permission réseau est présente dans l'APK."
            exit 1
          fi

      - name: Empreintes de l'APK et du certificat
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 de l'APK : $(sha256sum "$APK" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p dist
          cp "$APK" "dist/boussole-test-${GITHUB_SHA::8}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boussole-test-apk
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

  # Parcours utilisateur complet sur un émulateur Android, sur l'APK exact
  # qui sera publié. Aucun APK n'est publié si ce job échoue.
  e2e:
    name: Parcours complet sur émulateur
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Construire le module de test
        run: ./gradlew -p android :e2e:assembleDebug --console=plain

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: boussole-test-apk
          path: dist

      - name: Activer l'accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Parcours complet
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          # Image AOSP nue : plus légère que google_apis, moins de dialogues « ne répond pas ».
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./scripts/e2e.sh

      - name: Conserver les journaux
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: e2e-results/
          retention-days: 7
          if-no-files-found: ignore

  # Publication séparée du build : seul ce job, qui n'exécute aucun code du
  # projet ni de ses dépendances, reçoit le droit d'écrire (créer la Release).
  publish:
    name: Publier l'APK de test (lien fixe)
    needs: [build, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-test-apk
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: boussole-test-apk
          path: dist

      - name: Remplacer la Release « test »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv dist/*.apk boussole-test.apk
          SHA256=$(sha256sum boussole-test.apk | cut -d' ' -f1)
          cat > notes.md <<NOTES
          ⚠️ **Version de test** (clé de signature temporaire) : exporte une sauvegarde chiffrée,
          désinstalle la version précédente, installe celle-ci, puis restaure ta sauvegarde.
          Chaque version publiée ici a passé le parcours complet sur émulateur.

          - Branche : \`${GITHUB_REF_NAME}\`
          - Commit : \`${GITHUB_SHA::8}\`
          - SHA-256 de l'APK : \`${SHA256}\`
          NOTES
          gh release delete test --yes --cleanup-tag || true
          gh release create test boussole-test.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Boussole — version de test (${GITHUB_SHA::8})" \
            --notes-file notes.md
