<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Écu — ton budget personnel, hors ligne et chiffré" />
    <meta name="theme-color" content="#1a56b0" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Écu" />
    <title>Écu</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash.
      // Lu depuis localStorage (non sensible) car la base est chiffrée.
      ;(function () {
        var pref = localStorage.getItem('app-budget-theme') || 'auto'
        var dark =
          pref === 'dark' ||
          (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
